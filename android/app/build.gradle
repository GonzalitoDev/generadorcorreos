// App Android (TWA): abre https://generadorcorreos.vercel.app a pantalla completa con el motor de Chrome.
// Las mejoras que se publican en la web llegan solas a la app, sin reinstalar.
plugins {
    id 'com.android.application'
}

def webHost = 'generadorcorreos.vercel.app'
def webUrl = "https://${webHost}/"

android {
    namespace 'app.vercel.generadorcorreos'
    compileSdk 34

    defaultConfig {
        applicationId 'app.vercel.generadorcorreos'
        minSdk 21
        targetSdk 34
        // GitHub Actions pasa el número de compilación para que cada APK actualice a la anterior.
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName "1.0.${System.getenv('VERSION_CODE') ?: '0'}"

        manifestPlaceholders = [hostName: webHost, defaultUrl: webUrl]
        resValue 'string', 'appName', 'Generador de Correos'
        resValue 'string', 'launcherName', 'Correos'
        resValue 'string', 'assetStatements',
            "[{ \\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": {\\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://${webHost}\\\"}}]"
    }

    signingConfigs {
        release {
            // La clave nunca se guarda en el repositorio: la arma el workflow a partir de los secretos de GitHub.
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'correos'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
