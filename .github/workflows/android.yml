# Compila la app Android (TWA) y la publica como descarga en GitHub Releases.
# La página enlaza a .../releases/latest/download/generadorcorreos.apk, que siempre apunta a la última.
name: App Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que estén los secretos de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltan los secretos ANDROID_KEYSTORE_BASE64 y ANDROID_KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Preparar la clave de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Compilar APK firmada
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Renombrar
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk generadorcorreos.apk
          sha256sum generadorcorreos.apk | tee generadorcorreos.apk.sha256

      - name: Borrar la clave del disco
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: generadorcorreos-apk
          path: |
            generadorcorreos.apk
            generadorcorreos.apk.sha256

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: App Android v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            App Android de Generador de Correos.
            Descargá `generadorcorreos.apk`, abrila en el celular y permití instalar apps de esta fuente.
            Huella SHA-256 del archivo: ver `generadorcorreos.apk.sha256`.
          files: |
            generadorcorreos.apk
            generadorcorreos.apk.sha256
